services:
  - type: web
    name: crypto-analyzer-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 65"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BINANCE_USE_TESTNET
        value: "true"
      - key: BINANCE_TESTNET_API_KEY
        sync: false
      - key: BINANCE_TESTNET_API_SECRET
        sync: false
